@if (user(); as user) {
  <a
    class="inline-flex max-w-full cursor-pointer items-center gap-2 rounded-field text-primary hover:underline"
    [routerLink]="['/users', user.handle]"
    [attr.aria-label]="showName() ? null : user.displayName + ' profile'"
    (mouseenter)="schedulePreview($event)"
    (mouseleave)="hidePreview()"
    (focus)="showPreviewOnFocus($event)"
    (blur)="hidePreview()"
    (keydown.escape)="hidePreview()"
  >
    @if (showName()) {
      {{ user.displayName }}
    }
    <img
      class="size-8 shrink-0 rounded-full border border-base-300 object-cover"
      [src]="user.imageURL"
      [attr.width]="imgWidth() ?? null"
      [attr.height]="imgHeight() ?? null"
      [alt]="'Profile picture of ' + user.displayName"
    />
    @if (previewVisible()) {
      <span
        aria-hidden="true"
        class="pointer-events-none fixed z-50 block w-72 max-w-[calc(100vw-1rem)] overflow-hidden rounded-box border border-base-300 bg-base-100 text-left text-base-content shadow-xl"
        [style.left.px]="previewLeft()"
        [style.top.px]="previewTop()"
        [style.transform]="previewAbove() ? 'translateY(-100%)' : null"
      >
        <span class="relative block h-20 bg-linear-to-br from-primary/35 via-secondary/15 to-base-300">
          @if (user.bannerURL) {
            <img [src]="user.bannerURL" class="absolute inset-0 size-full object-cover" alt="" />
          }
        </span>
        <span class="block px-4 pb-4">
          <img
            [src]="user.imageURL"
            class="relative -mt-7 size-14 rounded-full border-4 border-base-100 bg-base-100 object-cover"
            alt=""
          />
          <span class="mt-1 block truncate font-bold">{{ user.displayName }}</span>
          <span class="block truncate text-sm text-base-content/60">&#64;{{ user.handle }}</span>
          @if (user.description) {
            <span class="mt-2 line-clamp-3 block whitespace-pre-line break-words text-sm">{{ user.description }}</span>
          }
        </span>
      </span>
    }
  </a>
} @else {
  <span class="text-sm text-base-content/60">Unknown user</span>
}
