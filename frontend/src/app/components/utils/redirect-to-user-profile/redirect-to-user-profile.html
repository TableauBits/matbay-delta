@if (user(); as user) {
  <a
    class="inline-flex max-w-full cursor-pointer items-center gap-2 rounded-field text-primary hover:underline"
    (click)="redirectToUserPage(user.handle)"
    (keydown.enter)="redirectToUserPage(user.handle)"
    [attr.role]="showName() ? 'link' : null"
    [attr.tabindex]="showName() ? 0 : null"
  >
    @if (showName()) {
      {{ user.displayName }}
    }
    <img
      class="size-8 shrink-0 rounded-full border border-base-300 object-cover"
      [src]="user.imageURL"
      [attr.width]="imgWidth() ?? null"
      [attr.height]="imgHeight() ?? null"
      [alt]="'Profil de ' + user.displayName"
    />
  </a>
} @else {
  <span class="text-sm text-base-content/60">Unknown user</span>
}
