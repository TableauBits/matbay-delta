<section class="card border border-base-300 bg-base-100 p-5 sm:p-8">
  <h2 class="mb-6">Update profile</h2>
  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="grid gap-5">
    <label class="grid gap-2 text-sm font-medium">
      Display name
      <input
        class="input w-full border-base-300"
        formControlName="displayName"
        placeholder="Display name"
        type="text"
      />
    </label>
    <label class="grid gap-2 text-sm font-medium">
      Description
      <input class="input w-full border-base-300" formControlName="description" placeholder="Description" type="text" />
    </label>
    <label class="grid gap-2 text-sm font-medium">
      Image URL
      <input class="input w-full border-base-300" formControlName="imageURL" placeholder="Image URL" type="text" />
    </label>
    <label class="grid gap-2 text-sm font-medium">
      Banner image URL
      <input
        class="input w-full border-base-300"
        formControlName="bannerURL"
        placeholder="https://example.com/banner.jpg"
        type="text"
      />
    </label>
    <button class="btn btn-primary mt-2 w-full sm:w-fit" type="submit">Save profile</button>
  </form>
</section>
