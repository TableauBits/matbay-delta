@if (error(); as error) {
  <p class="alert alert-error alert-soft" role="alert">Error loading artist : "{{ error.error }}".</p>
} @else if (artist(); as artist) {
  <h2>{{ artist.name }}</h2>
  <p>Added on: {{ artist.creationDate }}</p>
} @else {
  <p class="text-base-content/60" role="status">Loading artist...</p>
}
