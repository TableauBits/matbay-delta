<a href="#main-content" class="btn btn-primary fixed top-2 left-2 z-50 -translate-y-20 focus:translate-y-0"
  >Skip to content</a
>
@if (deltaAuth.isAuthenticated() | async) {
  <app-navigation-bar />
  <main id="main-content" tabindex="-1" class="mx-auto w-full max-w-6xl flex-1 px-4 py-8 sm:px-6 sm:py-12">
    <router-outlet />
  </main>
} @else {
  <main id="main-content" tabindex="-1" class="flex flex-1 items-center justify-center px-4 py-12">
    <section class="card w-full max-w-md border border-base-300 bg-base-100 p-6 sm:p-8">
      <h1 class="mb-3">Welcome to <span class="text-primary">MATBay Δ</span></h1>
      <p class="mb-6 text-base-content/70">Please log in with your TableauBits account to access the app.</p>
      <button class="btn btn-primary w-full" (click)="deltaAuth.login()">Log in</button>
    </section>
  </main>
}
<footer class="border-t border-base-300 px-4 py-5 text-center text-xs text-base-content/60">
  MATBay Δ by TableauBits · version {{ version.fullString() }}
</footer>
<app-snackbar />
